# ============================================================================
# config.yaml -- the single edit point for playtest tuning (see AGENTS.md).
# Every knob's full explanation lives in CONFIG_REFERENCE.md, keyed by the SAME
# dotted name -- search that file for a key (e.g. game_screen.mode) for details.
# Keep this file scannable: a terse one-line label per knob here; put the prose
# in CONFIG_REFERENCE.md, not back into these comments.
# ============================================================================

window:
  width: 800
  height: 600
  title: Word Tetris
  vsync: true             # false = don't block the loop on the monitor refresh [ref: window.vsync]
  # vsync: false             # false = don't block the loop on the monitor refresh [ref: window.vsync]
  osx_alt_loop: true      # macOS Apple Silicon: use pyglet's alt event loop; fixes dropped clicks [ref: window.osx_alt_loop]
  # osx_alt_loop: false      # macOS Apple Silicon: use pyglet's alt event loop; fixes dropped clicks [ref: window.osx_alt_loop]

game:
  ups: 60
  language: en          # a top-level key in assets/strings.yaml (en, es, ...)
  # language: es

audio:
  master_volume: 0.8

# Capture a play session to sessions/<id>.log for replay/analysis.
logging:
  enabled: true
  first_mouse_probe: true   # macOS: log OS-swallowed "click twice" clicks [ref: logging.first_mouse_probe]
  perf_metrics: true        # per-heartbeat frame-time/RAM snapshot in the log [ref: logging.perf_metrics]

# Points per cleared word; every weight is an independent tunable. [ref: scoring]
scoring:
  enabled:                   true
  word_base:                 5
  per_cell:                  3
  per_letter:                2
  per_extra_gram_letter:     3
  obstacle_cell_bonus:       10
  mission_cell_bonus:        15
  sand_timer_cell_bonus:     20
  fossil_reuse_bonus:        5
  new_word_bonus:            15
  fill_board_bonus:          100
  time_remaining_per_second: 1
  word_score_display:        breakdown   # sum | breakdown -- per-word score readout [ref: scoring.word_score_display]
  # word_score_display:        sum         # sum | breakdown -- per-word score readout [ref: scoring.word_score_display]

dictionary:
  # Validation word list: headwords_20k (21.9k, no inflections) vs expanded (~60k).
  # word_source: headwords_20k
  word_source: expanded
  # Also accept the ~16k obscure 2of12 tier (+2 hint surcharge, orange on collect).
  # include_obscure: false
  include_obscure: true
  # Page the mock word list (A-Z tab exercise) vs read real player_dictionary.txt.
  # use_mock_data: true
  use_mock_data: false
  mock_data_path: tests/assets/mock_player_dictionary.txt
  # Dictionary screen: show each word's best composition score beside it. [ref: dictionary.show_word_scores]
  # show_word_scores: true
  show_word_scores: false
  # Dictionary screen: reveal a word's score only while hovered, with its cell render. [ref: dictionary.show_word_scores_on_hover]
  show_word_scores_on_hover: true
  # show_word_scores_on_hover: false

rules:
  # Which styling / animation file to load, by bare filename under its assets/
  # subdir. A game mode can swap the whole file via these rules. [ref: assets.colors]
  assets.colors:             default_colors.yaml
  # [ref: assets.loading_animation]
  assets.loading_animation:  default_loading_animation.yaml

  # Gram font sizing. [ref: gram.font_size]
  # gram.font_size:         rule_gram_font_scale_by_length
  # gram.font_size:         rule_gram_font_fixed
  gram.font_size:         rule_gram_font_scale_single_as_double

  # Cell glyph color hint by potential score. [ref: board.cell_text_color]
  # board.cell_text_color:  rule_cell_text_plain
  board.cell_text_color:  rule_cell_text_score_gradient

  # Dedup 2+-letter grams across a game (every picker). [ref: gram.dedup]
  gram.dedup:             rule_no_duplicate_multigrams
  # gram.dedup:           rule_allow_duplicate_grams

  # Cap duplicate single letters in the OPENING FORMATION. [ref: gram.unigram_dedup]
  gram.unigram_dedup:     rule_max_3_duplicate_unigrams
  # gram.unigram_dedup:   rule_nolimit_duplicate_unigrams

  # Re-roll hard-to-spell digrams (every picker). [ref: gram.double_consonant_digram]
  gram.double_consonant_digram: rule_skip_double_consonant_digrams
  # gram.double_consonant_digram: rule_allow_double_consonant_digrams
  gram.only_vowel_digram:       rule_skip_only_vowel_digrams
  # gram.only_vowel_digram:     rule_skip_only_vowel_digrams_no_y
  # gram.only_vowel_digram:     rule_allow_only_vowel_digrams

  game_screen.grid:         rule_use_hex_grid
  # game_screen.grid:       rule_use_square_grid

  # Board columns (grid is square) + player piece-pool size. [ref: game_screen.grid_width]
  game_screen.grid_width:       8
  game_screen.piece_pool_size:  100

  # MOVING-phase strategy: jigsaw / typewriter / omniswap / constellation. [ref: game_screen.mode]
  # game_screen.mode:         rule_mode_jigsaw
  # game_screen.mode:       rule_mode_typewriter
  # game_screen.mode:       rule_mode_omniswap_vs_timer
  game_screen.mode:       rule_mode_constellation

  # CONSTELLATION: max distinct cell-assemblies the matcher returns per word (the
  # chooser cycles them; auto-pick keeps fewest-cell). [ref: game_screen.constellation_max_paths]
  game_screen.constellation_max_paths: 24

  # CONSTELLATION: do vacated cells refill or stay empty. [ref: game_screen.constellation_turnover]
  # game_screen.constellation_turnover: rule_constellation_no_replenish
  game_screen.constellation_turnover: rule_constellation_replenish

  # CONSTELLATION: seconds a replenished cell fades in (0 = instant pop). [ref: game_screen.constellation_replenish_fade_seconds]
  game_screen.constellation_replenish_fade_seconds: 2.0

  # CONSTELLATION: auto-finish when no word can be formed from the remaining grams. [ref: game_screen.constellation_auto_end]
  # game_screen.constellation_auto_end: rule_constellation_auto_end_off
  game_screen.constellation_auto_end: rule_constellation_auto_end_on

  # OMNISWAP countdown start seconds (per-phase budget, or whole-game clock in race).
  game_screen.omniswap_timer_seconds: 360

  # SAND-TIMER settings (only rule_omniswap_timer_sand). [ref: game_screen.sand_timer_delay_seconds]
  game_screen.sand_timer_delay_seconds: 15
  game_screen.sand_timer_seconds:       30
  game_screen.sand_timer_count:          1

  # OMNISWAP timer + endgame variant: per_phase / race / sand. [ref: game_screen.omniswap_timer]
  # game_screen.omniswap_timer:  rule_omniswap_timer_per_phase
  game_screen.omniswap_timer: rule_omniswap_timer_race
  # game_screen.omniswap_timer: rule_omniswap_timer_sand

  # Whole-game countdown, any mode: on/off. [ref: game_screen.game_timer]
  game_screen.game_timer: rule_game_timer_off
  # game_screen.game_timer: rule_game_timer_on
  # Whole-game countdown length in seconds (when on). [ref: game_screen.game_timer_seconds]
  game_screen.game_timer_seconds: 120

  # TYPEWRITER cursor visit order. [ref: game_screen.cursor_path]
  game_screen.cursor_path:  rule_cursor_typewriter

  # On a TYPEWRITER swap, which cells count as placed. [ref: game_screen.typewriter_swap]
  game_screen.typewriter_swap: rule_swap_places_cursor_only
  # game_screen.typewriter_swap: rule_swap_places_both

  # PRESETS: to run a mode, flip a bundle of keys with it. [ref: TYPEWRITER PRESET / OMNISWAP PRESET]

  # Min word size. [ref: game_screen.word_length]
  game_screen.word_length:  rule_word_min3letters_min2cells
  # game_screen.word_length: rule_word_min2letters_min2cells

  # Enumerate every word the opening board could spell -> coverage.csv (BLOCKING, slow).
  # game_screen.starting_coverage_dictionary:   rule_starting_coverage_off
  game_screen.starting_coverage_dictionary: rule_starting_coverage_on

  # Allow clearing a word already cleared this game. [ref: game_screen.word_repeat]
  game_screen.word_repeat:  rule_repeat_block
  # game_screen.word_repeat: rule_repeat_allow

  # Cleared-word path overlay. [ref: game_screen.word_trail]
  # game_screen.word_trail:           rule_word_trail_on
  game_screen.word_trail:         rule_word_trail_off
  game_screen.word_trail_thickness: 8
  game_screen.word_trail_opacity:   0.5

  # How multi-path words are chosen/confirmed. [ref: game_screen.clear_disambiguation]
  game_screen.clear_disambiguation:   rule_disambig_cycle_one_or_more_choices
  # game_screen.clear_disambiguation: rule_disambig_cycle_two_or_more_choices
  # game_screen.clear_disambiguation: rule_disambig_auto_pick
  game_screen.disambig_line_thickness:          8
  game_screen.disambig_line_thickness_selected: 16
  game_screen.disambig_line_opacity:   1.0
  # How an open chooser is drawn: blue lines vs cell text-highlight + lime fill. [ref: game_screen.disambig_display]
  # game_screen.disambig_display:        rule_disambig_display_lines
  game_screen.disambig_display:      rule_disambig_display_highlight
  # Whether a back-out gesture exits the candidate chooser.
  game_screen.disambig_cancel:         rule_disambig_cancel_on
  # game_screen.disambig_cancel:       rule_disambig_cancel_off

  # Rows in the right-pane cleared-word list. [ref: moving_side_pane.wordlist_rows]
  moving_side_pane.wordlist_rows:   30

  # Where each live player piece spawns. [ref: game_screen.spawn]
  game_screen.spawn:        rule_spawn_random_spot
  # game_screen.spawn:      rule_spawn_center

  game_screen.spawn_orientation: rule_orient_random
  # game_screen.spawn_orientation: rule_orient_default

  # Opening obstacle/mission layout (or full-board player fill). [ref: game_screen.setup_formation]
  # game_screen.setup_formation: rule_formation_scattered
  # game_screen.setup_formation: rule_formation_mission_center_obstacle_ring
  # game_screen.setup_formation: rule_formation_fill_player_diagonal
  # game_screen.setup_formation: rule_formation_fill_player_wood_grain
  # game_screen.setup_formation: rule_formation_fill_player_random
  # game_screen.setup_formation: rule_formation_fill_ideation_trigram_sidepanes_digram_centercircle
  # game_screen.setup_formation: rule_formation_fill_ideation_trigram_sidepanes_digram_bottompyramid
  # game_screen.setup_formation: rule_formation_fill_ideation_trigram_sidepanes
  game_screen.setup_formation: rule_formation_fill_ideation_trigram_sidepanes_zigzag

  # Counts for rule_formation_scattered (0 also gates that victory rule). [ref: game_screen.obstacle_count]
  game_screen.obstacle_count: 4
  game_screen.mission_count: 2

  # Stage 1 (pathfind): how the hex search snakes the board. [ref: hex_grid.word_pathfinding]
  # hex_grid.word_pathfinding: rule_snake_rightanddown_nosharptwist   #TODO retest these after refactor
  # hex_grid.word_pathfinding: rule_snake_rightanddown  #TODO retest these after refactor
  # hex_grid.word_pathfinding: rule_snake_straightline  #TODO retest these after refactor
  hex_grid.word_pathfinding: rule_snake_anydirection

  # Stage 2a (nucleate): which found words count this phase. [ref: game_screen.word_nucleation]
  # game_screen.word_nucleation: rule_adjacent_to_placed_pieces
  game_screen.word_nucleation: rule_nucleate_anywhere
  # game_screen.word_nucleation: rule_nucleate_none

  # Stage 2b: independent "must include a placed cell" filter. [ref: game_screen.placed_cell_requirement]
  # (related to word nucleation)
  game_screen.placed_cell_requirement: rule_placed_cell_optional
  # game_screen.placed_cell_requirement: rule_require_placed_cell

  # Stage 2c: independent "must include a fossilized cell" filter. [ref: game_screen.fossil_requirement]
  # (related to word nucleation)
  game_screen.fossil_requirement: rule_fossil_cell_optional
  # game_screen.fossil_requirement: rule_require_fossil_cell

  # Waive the fossil requirement until the first word clears. [ref: game_screen.fossil_requirement_first_word]
  # game_screen.fossil_requirement_first_word: rule_fossil_skip_first_word
  game_screen.fossil_requirement_first_word: rule_fossil_no_skip
  # game_screen.fossil_requirement_first_word: rule_fossil_seed_center

  # Whole-gram vs partial-gram consumption. [ref: game_screen.gram_usage]
  game_screen.gram_usage: rule_gram_use_whole
  # game_screen.gram_usage: rule_gram_use_partial

  # May a new word reuse fossilized cells. [ref: game_screen.fossil_word_use]
  game_screen.fossil_word_use: rule_fossil_block
  # game_screen.fossil_word_use: rule_fossil_allow

  # Two phases (MOVING -> SELECTING) vs one merged MOVING_AND_SELECTING pane.
  # Single-phase is for pre-filled-board modes only. [ref: game_screen.phase_model]
  game_screen.phase_model: rule_two_phase
  # game_screen.phase_model: rule_single_phase

  # Stage 3 (select): auto-clear vs interactive text entry. [ref: game_screen.word_select]
  # game_screen.word_select: rule_select_mostwords_withoverlaps_withrepeats
  game_screen.word_select: rule_select_by_text_input

  # When typed words clear: per-submit vs batch at phase end. [ref: game_screen.clear_timing]
  game_screen.clear_timing: rule_clear_at_phase_end
  # game_screen.clear_timing: rule_clear_on_submit

  # Words allowed per SELECT phase. [ref: game_screen.select_word_limit]
  # game_screen.select_word_limit: rule_unlimited_words
  game_screen.select_word_limit: rule_one_word_per_select

  # Auto-submit the carried hunt word when ENTER opens SELECT. [ref: game_screen.select_autosubmit_hunt]
  game_screen.select_autosubmit_hunt: rule_select_autosubmit_on
  # game_screen.select_autosubmit_hunt: rule_select_autosubmit_off

  # Run selection every placement vs every N. [ref: game_screen.select_trigger]
  game_screen.select_trigger: rule_select_every_placement
  # game_screen.select_trigger: rule_select_after_n_placements
  game_screen.select_trigger_count: 5

  # Skip selection when the placed piece is isolated. [ref: game_screen.skip_select_isolated]
  # game_screen.skip_select_isolated: rule_skip_select_if_isolated
  game_screen.skip_select_isolated: rule_never_skip_select

  # What a board left-click does during SELECTING. [ref: game_screen.select_click]
  game_screen.select_click: rule_select_click_move_piece
  # game_screen.select_click: rule_select_click_none

  # Echo a rejected word as a dim "You typed:" ghost. [ref: game_screen.reject_ghost]
  game_screen.reject_ghost: rule_reject_ghost_on
  # game_screen.reject_ghost: rule_reject_ghost_off

  # Right-pane word click swaps in a word-piece. [ref: game_screen.player_word_piece]
  # game_screen.player_word_piece: rule_player_word_piece_enabled
  game_screen.player_word_piece: rule_player_word_piece_disabled

  # RIGHT-click gram manipulation, one slot per gram shape (C->CC doubling / collapse;
  # Y is a consonant). rule_rightclick_none disables a slot. [ref: game_screen.rightclick_*]
  game_screen.rightclick_unigram: rule_unigram_double   # O->OO
  # game_screen.rightclick_unigram: rule_rightclick_none
  game_screen.rightclick_cc: rule_cc_collapse           # LL->L
  # game_screen.rightclick_cc: rule_rightclick_none
  game_screen.rightclick_cv: rule_cv_double             # BA->BBA
  # game_screen.rightclick_cv: rule_rightclick_none
  game_screen.rightclick_vc: rule_vc_double             # AN->ANN
  # game_screen.rightclick_vc: rule_rightclick_none
  game_screen.rightclick_vv: rule_vv_collapse           # EE->E (pairs with unigram E->EE)
  # game_screen.rightclick_vv: rule_rightclick_none       # EE: no consonant, no-op
  game_screen.rightclick_ck: rule_ck_double             # ST->SST (front only)
  # game_screen.rightclick_ck: rule_rightclick_none

  # Also allow gram manipulation during SELECTING. [ref: game_screen.gram_manip_in_selecting]
  game_screen.gram_manip_in_selecting: rule_gram_manip_in_selecting_enabled
  # game_screen.gram_manip_in_selecting: rule_gram_manip_in_selecting_disabled

  # Word-hunt highlight: which grams/letters light up. [ref: game_screen.hunt_highlight]
  # game_screen.hunt_highlight: rule_hunt_full_gram
  game_screen.hunt_highlight: rule_hunt_full_gram_or_dedup
  # game_screen.hunt_highlight: rule_hunt_single_letters
  game_screen.hunt_highlight_style: rule_hunt_style_text_recolor

  game_screen.rightclick_vcv: rule_vcv_double           # ARE->ARRE
  # game_screen.rightclick_vcv: rule_rightclick_none
  game_screen.rightclick_cvk: rule_cvk_double           # MER->MMER/MERR (alternating)
  # game_screen.rightclick_cvk: rule_rightclick_none
  game_screen.rightclick_vowelwild: rule_rightclick_none  # wild cell: TBD

  # Show the lifetime dictionary-size readout. [ref: game_screen.dictionary_count]
  # game_screen.dictionary_count: rule_show_dictionary_count
  game_screen.dictionary_count: rule_hide_dictionary_count

  # Victory condition (one active). [ref: game_screen.victory]
  # game_screen.victory: rule_victory_missions_cleared
  # game_screen.victory: rule_victory_missions_and_obstacles_cleared
  # game_screen.victory: rule_victory_obstacles_cleared
  # game_screen.victory: rule_victory_grid_empty
  game_screen.victory: rule_victory_none

  # Whole-board fill bonus; match variant to the mode. [ref: game_screen.fill_board]
  game_screen.fill_board: rule_fill_board_all_fossilized
  # game_screen.fill_board: rule_fill_board_all_occupied
  # game_screen.fill_board: rule_fill_board_off

  # May a piece move onto / place over an occupied cell, by cell type. [ref: game_screen.cell_overlap_*]
  # game_screen.cell_overlap_player: rule_block_moveandplace_over_player_cell
  game_screen.cell_overlap_player: rule_moveandplace_over_player_cell
  # game_screen.cell_overlap_obstacle: rule_moveandplace_over_obstacle_cell
  game_screen.cell_overlap_obstacle: rule_block_moveandplace_over_obstacle_cell
  # game_screen.cell_overlap_mission: rule_moveandplace_over_mission_cell
  game_screen.cell_overlap_mission: rule_block_moveandplace_over_mission_cell
  # game_screen.cell_overlap_fossilized: rule_moveandplace_over_fossilized_cell
  game_screen.cell_overlap_fossilized: rule_block_moveandplace_over_fossilized_cell

  # Fate of a cleared word's cells: remove vs fossilize. [ref: game_screen.clear_action]
  game_screen.clear_action: rule_clear_remove
  # game_screen.clear_action: rule_clear_fossilize

  # Covered "old" cells are deleted (so covered obstacles/missions count cleared).
  game_screen.cell_overlap_action: rule_old_cells_get_delete

  # Length mix for rule_grams_greater_than_47_lengthcontrolled (opening board = quota).
  # Relative shares; a 0 drops that length. [ref: gram_length.*_percent]
  gram_length.unigram_percent:     50
  gram_length.digram_percent:      20
  gram_length.trigramplus_percent: 15

  # Opening-board unigram split: common glue vs uncommon flavor. [ref: gram_length.unigram_common_percent]
  gram_length.unigram_common_percent:   60
  gram_length.unigram_uncommon_percent: 40

  # Force still-missing required letters into opening unigram slots. [ref: game_screen.formation_vowel_coverage]
  # game_screen.formation_vowel_coverage: rule_vowel_coverage_off
  game_screen.formation_vowel_coverage: rule_vowel_coverage_each_unigram

  # How the LOADING fade-in groups each cell's GLYPH (letter). [ref: game_screen.loading_fade_glyphs_category]
  # game_screen.loading_fade_glyphs_category: rule_loading_fade_by_length_glyph
  # game_screen.loading_fade_glyphs_category: rule_loading_fade_by_ideation_strength_glyph
  # game_screen.loading_fade_glyphs_category: rule_loading_fade_by_ideation_fix_glyph
  game_screen.loading_fade_glyphs_category: rule_loading_fade_by_ideation_length_strength_fix_glyph
  # game_screen.loading_fade_glyphs_category: rule_loading_fade_by_category_glyph

  # Steer opening digram/trigram+ cells toward the ideation profile. [ref: game_screen.ideation_formation]
  # game_screen.ideation_formation: rule_ideation_formation_off
  game_screen.ideation_formation: rule_ideation_formation_on

  gram_ideation.digram.strong_percent:  70
  gram_ideation.digram.prefix_percent:  30
  gram_ideation.digram.midfix_percent:  30
  gram_ideation.digram.suffix_percent:  30

  gram_ideation.trigramplus.strong_percent: 70
  gram_ideation.trigramplus.prefix_percent: 50
  gram_ideation.trigramplus.midfix_percent: 10
  gram_ideation.trigramplus.suffix_percent: 40

  # Gram picker per cell class. [ref: *_player / *_obstacle / *_mission .gram_pick]
  # square_player.gram_pick:   rule_scrabble_with_allvowelswild
  square_player.gram_pick: rule_scrabble_distribution
  # square_player.gram_pick: rule_random_letters
  # square_player.gram_pick: rule_englishcorpus_random_unigram
  # square_player.gram_pick: rule_englishcorpus_random_digram
  # square_player.gram_pick: rule_grams_greater_than_47
  # square_player.gram_pick: rule_grams_greater_than_47_lengthcontrolled
  square_player.gram_pick: rule_mixed_scrabble_digram52
  # square_player.gram_pick: rule_digram52_distribution
  # square_player.gram_pick: rule_trigram_equalweight

  # square_player.piece_set:   rule_use_tetriminos
  square_player.piece_set: rule_use_dominos
  # square_player.piece_set: rule_use_unimos

  # square_obstacle.gram_pick: rule_scrabble_distribution
  # square_obstacle.gram_pick: rule_random_letters
  # square_obstacle.gram_pick: rule_englishcorpus_random_unigram
  # square_obstacle.gram_pick: rule_englishcorpus_random_digram
  # square_obstacle.gram_pick: rule_grams_greater_than_47
  # square_obstacle.gram_pick: rule_grams_greater_than_47_lengthcontrolled
  # square_obstacle.gram_pick: rule_mixed_scrabble_digram52
  square_obstacle.gram_pick: rule_digram52_distribution
  # square_obstacle.gram_pick: rule_trigram_equalweight

  square_obstacle.piece_set: rule_use_dominos
  # square_obstacle.piece_set: rule_use_tetriminos
  # square_obstacle.piece_set: rule_use_unimos

  # square_mission.gram_pick: rule_scrabble_distribution
  # square_mission.gram_pick: rule_random_letters
  # square_mission.gram_pick: rule_englishcorpus_random_unigram
  # square_mission.gram_pick: rule_englishcorpus_random_digram
  # square_mission.gram_pick: rule_grams_greater_than_47
  # square_mission.gram_pick: rule_grams_greater_than_47_lengthcontrolled
  # square_mission.gram_pick: rule_mixed_scrabble_digram52
  square_mission.gram_pick: rule_digram52_distribution
  # square_mission.gram_pick: rule_trigram_equalweight

  square_mission.piece_set: rule_use_dominos
  # square_mission.piece_set: rule_use_tetriminos
  # square_mission.piece_set: rule_use_unimos

  # hex_player.gram_pick also governs the initial board formation cells.
  # hex_player.gram_pick:    rule_grams_greater_than_47
  hex_player.gram_pick:      rule_grams_greater_than_47_lengthcontrolled
  # hex_player.gram_pick:    rule_random_letters
  # hex_player.gram_pick:    rule_scrabble_with_allvowelswild
  # hex_player.gram_pick:    rule_scrabble_distribution
  # hex_player.gram_pick:    rule_englishcorpus_random_unigram
  # hex_player.gram_pick:    rule_englishcorpus_random_digram
  # hex_player.gram_pick:    rule_mixed_scrabble_digram52
  # hex_player.gram_pick:    rule_digram52_distribution
  # hex_player.gram_pick:    rule_trigram_equalweight

  hex_player.piece_set:    rule_use_hex_dominos
  # hex_player.piece_set:  rule_use_hex_unimos

  # hex_obstacle.gram_pick: rule_scrabble_distribution
  # hex_obstacle.gram_pick: rule_random_letters
  # hex_obstacle.gram_pick: rule_englishcorpus_random_unigram
  # hex_obstacle.gram_pick: rule_englishcorpus_random_digram
  # hex_obstacle.gram_pick: rule_grams_greater_than_47
  # hex_obstacle.gram_pick: rule_grams_greater_than_47_lengthcontrolled
  # hex_obstacle.gram_pick: rule_mixed_scrabble_digram52
