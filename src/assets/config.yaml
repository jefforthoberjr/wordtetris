window:
  width: 800
  height: 600
  title: Word Tetris

game:
  ups: 60
  # UI language: a top-level key in assets/strings.yaml (e.g. en, es). Missing
  # keys fall back to English.
  language: en
  # language: es

audio:
  master_volume: 0.8

dictionary:
  # TEMP (playtest): page the large mock word list so the A-Z tabs and sub-pages
  # can be exercised before the player has collected thousands of words. Set
  # use_mock_data to false to read the player's real player_dictionary.txt.
  # use_mock_data: true
  use_mock_data: false
  mock_data_path: tests/assets/mock_player_dictionary.txt

# Note: game_screen.grid is a bundle:
# (the chosen grid builder wires up its own movement + clear rules)
rules:
  gram.font_size:           rule_gram_font_scale_by_length
  # gram.font_size:         rule_gram_font_fixed

  game_screen.grid:         rule_use_hex_grid
  # game_screen.grid:       rule_use_square_grid

  # MOVING-phase mode bundle (game_screen.mode): which moving-phase strategy runs.
  # The mode owns how the moving phase presents its active element and turns one
  # input into one committed action; the shared SELECT pipeline, word-finding,
  # board and dictionary are mode-agnostic.
  #   rule_mode_jigsaw -- MOVING_JIGSAWPUZZLE: one live piece at a time, free
  #     movement, place anywhere (the original mode)
  #   rule_mode_typewriter -- MOVING_TYPEWRITER: a single-cell cursor sweeps the
  #     pre-filled board; each turn swaps/replaces/passes the cursor cell (WIP)
  # game_screen.mode:         rule_mode_jigsaw
  game_screen.mode:       rule_mode_typewriter

  # Order the MOVING_TYPEWRITER cursor visits cells (game_screen.cursor_path).
  #   rule_cursor_typewriter -- top-left, left->right per line, carriage-return
  #     down, ending bottom-right (jittery on the offset hex rows; fine for now)
  game_screen.cursor_path:  rule_cursor_typewriter

  # TYPEWRITER PRESET -- to play MOVING_TYPEWRITER, set game_screen.mode above to
  # rule_mode_typewriter and also flip these (so the board starts full, formed
  # words freeze instead of clearing, there's no instant win, a pass always opens
  # word entry, and every action is a select turn):
  #   setup_formation     -> rule_formation_fill_player
  #   clear_action        -> rule_clear_fossilize
  #   victory             -> rule_victory_none
  #   skip_select_isolated -> rule_never_skip_select
  #   select_trigger      -> rule_select_every_placement
  #   word_nucleation     -> rule_nucleate_anywhere   (so words can form anywhere)
  # (word_select stays rule_select_by_text_input.)

  game_screen.word_length:  rule_word_min3letters_min2cells
  # game_screen.word_length: rule_word_min2letters_min2cells

  game_screen.word_repeat:  rule_repeat_block
  # game_screen.word_repeat: rule_repeat_allow

  # Player-piece spawn: where each single live piece appears, one at a time.
  game_screen.spawn:        rule_spawn_random_spot
  # game_screen.spawn:      rule_spawn_center

  game_screen.spawn_orientation: rule_orient_random
  # game_screen.spawn_orientation: rule_orient_default

  # Starting formation: how the whole opening set of obstacle + mission pieces is
  # laid out (built and placed before play). Separate from the per-piece player
  # spawn above; the formation owns how many pieces of each it lays down.
  #   rule_formation_scattered -- obstacle_count obstacles + mission_count
  #     missions, each at a random non-overlapping spot (the original opening)
  #   rule_formation_mission_center_obstacle_ring -- 1 mission on the center cell,
  #     ringed by one obstacle per neighbor (6 on a hex grid). Single-cell pieces.
  #   rule_formation_fill_player -- fill every board cell with a single-cell
  #     player piece (no obstacles/missions). Board opens fully packed; pair with
  #     game_screen.victory: rule_victory_none so it isn't an instant/blocked win.
  # game_screen.setup_formation: rule_formation_scattered
  # game_screen.setup_formation: rule_formation_mission_center_obstacle_ring
  game_screen.setup_formation: rule_formation_fill_player

  # How many obstacle / mission pieces rule_formation_scattered lays down. The
  # ring formation derives its own counts from board geometry and ignores these.
  # Also gate the obstacle/mission victory rules: a count of 0 means "the board
  # never started with this kind", so that victory rule can't be satisfied.
  game_screen.obstacle_count: 4
  game_screen.mission_count: 2

  # Stage 1 (pathfind): how the search walks the board to find words. Grid-level
  # because geometry differs -- the square board steps its 4 cardinals
  # (hardcoded); the hex board's snake directions are configurable here.
  # hex_grid.word_pathfinding: rule_snake_rightanddown_nosharptwist   #TODO retest these after refactor
  # hex_grid.word_pathfinding: rule_snake_rightanddown  #TODO retest these after refactor
  # hex_grid.word_pathfinding: rule_snake_straightline  #TODO retest these after refactor
  hex_grid.word_pathfinding: rule_snake_anydirection

  # Stage 2a (nucleate): of every word found, which count for the moving phase
  # just ended.
  #   rule_adjacent_to_placed_pieces -- keep words bridging any piece placed this
  #     phase (all of them are nucleation sites, not just the last) AND an
  #     existing cell
  #   rule_nucleate_anywhere -- every board word counts, wherever it sits (no tie
  #     to a placed piece, so words can be built anywhere)
  #   rule_nucleate_none -- nothing qualifies (clearing off)
  # game_screen.word_nucleation: rule_adjacent_to_placed_pieces
  game_screen.word_nucleation: rule_nucleate_anywhere
  # game_screen.word_nucleation: rule_nucleate_none

  # Stage 2b (placed-cell requirement): an independent filter on the nucleated
  # words -- whether a word must include a cell from a piece placed this phase.
  # Orthogonal to word_nucleation, so it composes: e.g. rule_nucleate_anywhere +
  # rule_require_placed_cell keeps any board word that also touches a placed cell.
  #   rule_require_placed_cell -- word must cover >=1 placed cell
  #   rule_placed_cell_optional -- no such requirement
  # (Optional by default; rule_adjacent_to_placed_pieces already needs a placed
  # cell, so the current behavior is unchanged.)
  game_screen.placed_cell_requirement: rule_placed_cell_optional
  # game_screen.placed_cell_requirement: rule_require_placed_cell

  # Gram usage: whether a word must use all of a cell's gram, or may take part.
  #   rule_gram_use_whole -- a word always consumes a cell's entire gram (orig)
  #   rule_gram_use_partial -- a word may start inside a gram (a suffix of its
  #     first cell) and end inside one (a prefix of its last cell); middle cells
  #     stay whole. The unused letters stay on the board, re-rendered in place
  #     (e.g. W + ING -> WIN leaves G; ING + OO + D -> GOOD leaves IN). In batch
  #     mode (clear_at_phase_end) several words may take different bites of one
  #     gram (H ING O -> HI + GO leaves N; W ING O -> WIN + GO clears it).
  # game_screen.gram_usage: rule_gram_use_whole
  game_screen.gram_usage: rule_gram_use_partial

  # Stage 3 (select): of the nucleated candidates, which to actually clear.
  #   rule_select_mostwords_withoverlaps_withrepeats -- automatic, instant
  #     (keep maximal paths: overlaps + repeats included, strict sub-words dropped)
  #   rule_select_by_text_input -- interactive: player types the words to clear
  #     in the right pane, then hits Next piece (the SELECTING phase)
  # game_screen.word_select: rule_select_mostwords_withoverlaps_withrepeats
  game_screen.word_select: rule_select_by_text_input

  # When typed words clear during the interactive SELECT phase.
  #   rule_clear_on_submit -- each submitted word clears from the board the
  #     moment it is submitted (original behavior)
  #   rule_clear_at_phase_end -- submitted words are held and their cells tinted
  #     light green; the whole batch clears together when the phase ends, so
  #     cells can be reused across words (overlaps + repeats -- a word may be
  #     entered once per distinct path). The interactive twin of
  #     rule_select_mostwords_withoverlaps_withrepeats.
  game_screen.clear_timing: rule_clear_at_phase_end
  # game_screen.clear_timing: rule_clear_on_submit

  game_screen.select_trigger: rule_select_every_placement
  # game_screen.select_trigger: rule_select_after_n_placements
  # Placements between selection turns for rule_select_after_n_placements
  game_screen.select_trigger_count: 5

  # Whether a placed piece touching nothing on the board skips the selection
  # (If an isolated piece can't bridge into any word, auto-skip for UX flow)
  #   rule_skip_select_if_isolated -- skip when the placed piece is isolated (orig)
  #   rule_never_skip_select -- always run selection, isolated or not
  game_screen.skip_select_isolated: rule_skip_select_if_isolated
  # game_screen.skip_select_isolated: rule_never_skip_select

  # What a left-click on a board cell does during the SELECTING phase.
  #   rule_select_click_type_gram -- type the clicked cell's gram into the entry
  #     field as a shortcut (no validation: repeats / non-adjacent cells are
  #     fine; the word rules still apply only on submit)
  #   rule_select_click_none -- board clicks do nothing while selecting
  # (The "Clear word" control is always shown, independent of this rule.)
  game_screen.select_click: rule_select_click_type_gram
  # game_screen.select_click: rule_select_click_none

  # Player word-piece: clicking a cleared word in the right pane during the
  # MOVING phase swaps the live piece for a single-cell piece carrying that whole
  # word as a multigram (usable to complete words like any other player piece).
  # The displaced piece is set aside and returns as the next piece once the
  # word-piece is placed. Only one swap per piece -- you can't click another word
  # until the word-piece is placed and a fresh pre-selected piece appears.
  #   rule_player_word_piece_enabled  -- allow the swap (clicks consume the word)
  #   rule_player_word_piece_disabled -- right-pane clicks do nothing
  game_screen.player_word_piece: rule_player_word_piece_enabled
  # game_screen.player_word_piece: rule_player_word_piece_disabled

  # Whether the right pane shows the player's lifetime dictionary-size readout.
  # game_screen.dictionary_count: rule_show_dictionary_count
  game_screen.dictionary_count: rule_hide_dictionary_count

  # Victory condition (only one active at a time):
  # game_screen.victory: rule_victory_missions_cleared
  # game_screen.victory: rule_victory_missions_and_obstacles_cleared
  # game_screen.victory: rule_victory_obstacles_cleared
  # game_screen.victory: rule_victory_grid_empty
  # rule_victory_none -- no win condition at all; the game runs until the player
  # quits (use with rule_formation_fill_player, which has no missions/obstacles).
  game_screen.victory: rule_victory_none

  # Cell overlap: deciding whether a piece may be moved onto / placed over a type of occupied cell
  
  # game_screen.cell_overlap_player: rule_block_moveandplace_over_player_cell
  game_screen.cell_overlap_player: rule_moveandplace_over_player_cell

  # game_screen.cell_overlap_obstacle: rule_moveandplace_over_obstacle_cell
  game_screen.cell_overlap_obstacle: rule_block_moveandplace_over_obstacle_cell

  # game_screen.cell_overlap_mission: rule_moveandplace_over_mission_cell
  game_screen.cell_overlap_mission: rule_block_moveandplace_over_mission_cell

  # game_screen.cell_overlap_fossilized: rule_moveandplace_over_fossilized_cell
  game_screen.cell_overlap_fossilized: rule_block_moveandplace_over_fossilized_cell

  # Clear action (game_screen.clear_action): the fate of the cells a formed word
  # covers when it is applied (clear-on-submit or the phase-end batch).
  #   rule_clear_remove -- the consumed cells leave the board, partial-gram aware
  #     (a word ending mid-gram leaves the leftover letters) -- the original
  #   rule_clear_fossilize -- every cell on the word's path freezes in place: the
  #     whole cell stays (letters intact) but goes dead -- un-swappable, skipped
  #     by word-finding and the typewriter cursor, tinted stone grey
  # game_screen.clear_action: rule_clear_remove
  game_screen.clear_action: rule_clear_fossilize

  # Cell overlap action: what happens to the "old" cells a placement covers.
  # rule_old_cells_get_delete treats them as gone, so a covered starting
  # obstacle (or mission) counts as cleared for the mission/obstacle victory
  # rules (otherwise covering one strands that victory condition).
  game_screen.cell_overlap_action: rule_old_cells_get_delete

  # square_player.gram_pick:   rule_scrabble_with_allvowelswild
  square_player.gram_pick: rule_scrabble_distribution
  # square_player.gram_pick: rule_random_letters
  # square_player.gram_pick: rule_englishcorpus_random_unigram
  # square_player.gram_pick: rule_englishcorpus_random_digram
  # square_player.gram_pick: rule_gramcorpus_distribution
  square_player.gram_pick: rule_mixed_scrabble_digram52
  # square_player.gram_pick: rule_digram52_distribution
  # square_player.gram_pick: rule_trigram_equalweight
  # rule_scrabble_with_allvowelswild: scrabble weights, but vowels become wild cells
  # rule_trigram_equalweight: every trigram in jpo_5.2.2_trigrams.csv, equal odds

  # square_player.piece_set:   rule_use_tetriminos
  square_player.piece_set: rule_use_dominos
  # square_player.piece_set: rule_use_unimos

  # Starting obstacles for the square grid: own gram-pick + piece set, so they
  # can differ from the playable pieces (e.g. unigram dominos as obstacles).
  # square_obstacle.gram_pick: rule_scrabble_distribution
  # square_obstacle.gram_pick: rule_random_letters
  # square_obstacle.gram_pick: rule_englishcorpus_random_unigram
  # square_obstacle.gram_pick: rule_englishcorpus_random_digram
  # square_obstacle.gram_pick: rule_gramcorpus_distribution
  # square_obstacle.gram_pick: rule_mixed_scrabble_digram52
  square_obstacle.gram_pick: rule_digram52_distribution
  # square_obstacle.gram_pick: rule_trigram_equalweight

  square_obstacle.piece_set: rule_use_dominos
  # square_obstacle.piece_set: rule_use_tetriminos
  # square_obstacle.piece_set: rule_use_unimos

  # Starting missions for the square grid (the light-red goal pieces): own
  # gram-pick + piece set, the direct parallel of square_obstacle.*.
  # square_mission.gram_pick: rule_scrabble_distribution
  # square_mission.gram_pick: rule_random_letters
  # square_mission.gram_pick: rule_englishcorpus_random_unigram
  # square_mission.gram_pick: rule_englishcorpus_random_digram
  # square_mission.gram_pick: rule_gramcorpus_distribution
  # square_mission.gram_pick: rule_mixed_scrabble_digram52
  square_mission.gram_pick: rule_digram52_distribution
  # square_mission.gram_pick: rule_trigram_equalweight

  square_mission.piece_set: rule_use_dominos
  # square_mission.piece_set: rule_use_tetriminos
  # square_mission.piece_set: rule_use_unimos

  # hex_player.gram_pick:      rule_gramcorpus_distribution
  # hex_player.gram_pick:    rule_random_lettersw
  # hex_player.gram_pick:    rule_scrabble_with_allvowelswild
  hex_player.gram_pick:    rule_scrabble_distribution
  # hex_player.gram_pick:    rule_englishcorpus_random_unigram
  # hex_player.gram_pick:    rule_englishcorpus_random_digram
  # hex_player.gram_pick:    rule_mixed_scrabble_digram52
  # hex_player.gram_pick:    rule_digram52_distribution
  # hex_player.gram_pick:    rule_trigram_equalweight

  hex_player.piece_set:    rule_use_hex_dominos
  # hex_player.piece_set:  rule_use_hex_unimos

  # Starting obstacles for the hex grid: own gram-pick + piece set, so they can
  # differ from the playable pieces.
  # hex_obstacle.gram_pick: rule_scrabble_distribution
  # hex_obstacle.gram_pick: rule_random_letters
  # hex_obstacle.gram_pick: rule_englishcorpus_random_unigram
  # hex_obstacle.gram_pick: rule_englishcorpus_random_digram
  # hex_obstacle.gram_pick: rule_gramcorpus_distribution
  # hex_obstacle.gram_pick: rule_mixed_scrabble_digram52
  hex_obstacle.gram_pick: rule_digram52_distribution
  # hex_obstacle.gram_pick: rule_trigram_equalweight

  # hex_obstacle.piece_set: rule_use_hex_dominos
  hex_obstacle.piece_set: rule_use_hex_unimos

  # Starting missions for the hex grid (the light-red goal pieces): own gram-pick
  # + piece set, the direct parallel of hex_obstacle.*.
  # hex_mission.gram_pick: rule_scrabble_distribution
  # hex_mission.gram_pick: rule_random_letters
  # hex_mission.gram_pick: rule_englishcorpus_random_unigram
  # hex_mission.gram_pick: rule_englishcorpus_random_digram
  # hex_mission.gram_pick: rule_gramcorpus_distribution
  # hex_mission.gram_pick: rule_mixed_scrabble_digram52
  # hex_mission.gram_pick: rule_digram52_distribution
  hex_mission.gram_pick: rule_trigram_equalweight

  # hex_mission.piece_set: rule_use_hex_dominos
  hex_mission.piece_set: rule_use_hex_unimos

  # For piece sets that have multiple shapes, how to manage the distribution of shaped
  piece_pool.order:         rule_create_shuffled_roundrobin
  # piece_pool.order:       rule_create_pure_random
  # piece_pool.order:       rule_create_fixed_roundrobin
  # piece_pool.order:       rule_create_random_even_distribution
