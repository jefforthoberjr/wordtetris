window:
  width: 800
  height: 600
  title: Word Tetris

game:
  ups: 60

audio:
  master_volume: 0.8

dictionary:
  # TEMP (playtest): page the large mock word list so the A-Z tabs and sub-pages
  # can be exercised before the player has collected thousands of words. Set
  # use_mock_data to false to read the player's real player_dictionary.txt.
  # use_mock_data: true
  use_mock_data: false
  mock_data_path: tests/assets/mock_player_dictionary.txt

# Note: game_screen.grid is a bundle:
# (the chosen grid builder wires up its own movement + clear rules)
rules:
  gram.font_size:           rule_gram_font_scale_by_length
  # gram.font_size:         rule_gram_font_fixed

  game_screen.grid:         rule_use_hex_grid
  # game_screen.grid:       rule_use_square_grid

  game_screen.word_length:  rule_word_min3letters_min2cells
  # game_screen.word_length: rule_word_min2letters_min2cells

  game_screen.word_repeat:  rule_repeat_block
  # game_screen.word_repeat: rule_repeat_allow

  game_screen.spawn:        rule_spawn_random_spot
  # game_screen.spawn:      rule_spawn_center

  game_screen.spawn_orientation: rule_orient_random
  # game_screen.spawn_orientation: rule_orient_default

  # Stage 1 (pathfind): how the search walks the board to find words. Grid-level
  # because geometry differs -- the square board steps its 4 cardinals
  # (hardcoded); the hex board's snake directions are configurable here.
  # hex_grid.word_pathfinding: rule_snake_rightanddown_nosharptwist   #TODO retest these after refactor
  # hex_grid.word_pathfinding: rule_snake_rightanddown  #TODO retest these after refactor
  # hex_grid.word_pathfinding: rule_snake_straightline  #TODO retest these after refactor
  hex_grid.word_pathfinding: rule_snake_anydirection

  # Stage 2 (nucleate): of every word found, which count for the move just made.
  # rule_adjacent_to_placed_piece keeps words bridging the new piece and an
  # existing cell; rule_nucleate_none qualifies nothing (clearing off).
  game_screen.word_nucleation: rule_adjacent_to_placed_piece
  # game_screen.word_nucleation: rule_nucleate_none

  # Stage 3 (select): of the nucleated candidates, which to actually clear.
  #   rule_select_mostwords_withoverlaps_withrepeats -- automatic, instant
  #     (keep maximal paths: overlaps + repeats included, strict sub-words dropped)
  #   rule_select_by_text_input -- interactive: player types the words to clear
  #     in the right pane, then hits Next piece (the SELECTING phase)
  # game_screen.word_select: rule_select_mostwords_withoverlaps_withrepeats
  game_screen.word_select: rule_select_by_text_input

  square_piece.gram_pick:   rule_scrabble_distribution
  # square_piece.gram_pick: rule_random_letters
  # square_piece.gram_pick: rule_englishcorpus_random_unigram
  # square_piece.gram_pick: rule_englishcorpus_random_digram
  # square_piece.gram_pick: rule_gramcorpus_distribution
  # square_piece.gram_pick: rule_mixed_scrabble_digram52
  # square_piece.gram_pick: rule_digram52_distribution

  # square_piece.piece_set:   rule_use_tetriminos
  square_piece.piece_set: rule_use_dominos
  # square_piece.piece_set: rule_use_unimos

  # Starting obstacles for the square grid: own gram-pick + piece set, so they
  # can differ from the playable pieces (e.g. unigram dominos as obstacles).
  # square_obstacle.gram_pick: rule_scrabble_distribution
  # square_obstacle.gram_pick: rule_random_letters
  # square_obstacle.gram_pick: rule_englishcorpus_random_unigram
  # square_obstacle.gram_pick: rule_englishcorpus_random_digram
  # square_obstacle.gram_pick: rule_gramcorpus_distribution
  # square_obstacle.gram_pick: rule_mixed_scrabble_digram52
  square_obstacle.gram_pick: rule_digram52_distribution

  square_obstacle.piece_set: rule_use_dominos
  # square_obstacle.piece_set: rule_use_tetriminos
  # square_obstacle.piece_set: rule_use_unimos

  # hex_piece.gram_pick:      rule_gramcorpus_distribution
  # hex_piece.gram_pick:    rule_random_lettersw
  hex_piece.gram_pick:    rule_scrabble_distribution
  # hex_piece.gram_pick:    rule_englishcorpus_random_unigram
  # hex_piece.gram_pick:    rule_englishcorpus_random_digram
  # hex_piece.gram_pick:    rule_mixed_scrabble_digram52
  # hex_piece.gram_pick:    rule_digram52_distribution

  hex_piece.piece_set:    rule_use_hex_dominos
  # hex_piece.piece_set:  rule_use_hex_unimos

  # Starting obstacles for the hex grid: own gram-pick + piece set, so they can
  # differ from the playable pieces.
  # hex_obstacle.gram_pick: rule_scrabble_distribution
  # hex_obstacle.gram_pick: rule_random_letters
  # hex_obstacle.gram_pick: rule_englishcorpus_random_unigram
  # hex_obstacle.gram_pick: rule_englishcorpus_random_digram
  # hex_obstacle.gram_pick: rule_gramcorpus_distribution
  # hex_obstacle.gram_pick: rule_mixed_scrabble_digram52
  hex_obstacle.gram_pick: rule_digram52_distribution

  # hex_obstacle.piece_set: rule_use_hex_dominos
  hex_obstacle.piece_set: rule_use_hex_unimos

  # For piece sets that have multiple shapes, how to manage the distribution of shaped
  piece_pool.order:         rule_create_shuffled_roundrobin
  # piece_pool.order:       rule_create_pure_random
  # piece_pool.order:       rule_create_fixed_roundrobin
  # piece_pool.order:       rule_create_random_even_distribution
