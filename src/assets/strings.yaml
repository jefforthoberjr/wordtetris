# All user-facing text lives here, separate from code, so adding a language is
# one edit point. The active language is chosen by game.language in config.yaml;
# code looks strings up by key via config.get_string("key"). Missing keys fall
# back to English. Templates use {placeholders} filled by get_string(key, ...).
#
# To add a language: copy the `en:` block, translate the values (keep the keys
# and the {placeholders}), and set game.language to the new code.

en:
  # Title screen
  title:                 "WordTetris!"
  title_continue:        "press any button to continue"
  # Main menu
  menu_start:            "Start Game"
  menu_dictionary:       "My Dictionary"
  menu_exit:             "Exit"
  # Mode-select submenu (opened by "Start Game")
  menu_mode_select_title: "Select Mode"
  menu_back:             "Back"
  # Debug submenu (opened by "Debug" on the main menu)
  menu_debug:            "Debug"
  menu_debug_title:      "Debug"
  debug_play_end_video:  "Play endgame video"
  # In-game (pause) menu
  ingame_main_menu:      "Main Menu"
  ingame_exit:           "Exit"
  # Side panes (right of the board)
  loading:               "LOADING..."
  # Shown in place of "LOADING..." while the blocking starting-coverage pass runs.
  calculating:           "CALCULATING..."
  dictionary_count:      "Dictionary: {count} words"
  pieces_count:          "Pieces: {count}"
  # MOVING_LINE_BLAST piece-preview pane title.
  line_blast_pieces:     "Pieces"
  # MOVING_OMNISWAP countdown (seconds left in the moving phase)
  time_count:            "Time: {count}"
  # Running point total, shown near the timer in the right pane (see scoring.py)
  score_count:           "Score: {count}"
  type_a_word:           "Type a word:"
  hunt_a_word:           "Hunt a word:"
  pick_words:            "pick words:"
  clear_word:            "Clear word"
  submit_word:           "Submit word"
  next_piece:            "Next piece"
  # SELECTING-pane button that ends the game outright (constellation mode, where
  # no piece-adjacency close and, in the endless preset, no victory rule fires).
  end_game:              "End game"
  # MOVING-pane button that jumps straight to the SELECTING phase.
  select_words:          "Select words"
  disambig_prompt:       "Select which one:"
  # Shown in the chooser when a submitted word has a SINGLE clear path (the
  # always-confirm variant): Enter commits, or edit to hunt a different word.
  disambig_confirm_prompt: "Enter to confirm, or edit to change"
  # Echo of a just-rejected typed word, shown dim above the cleared entry field
  # so the player compares it to the spelling suggestion below.
  you_typed:             "You typed: {word}"
  # Victory overlay
  victory:               "VICTORY"
  # End-of-game overlay when there's no win/lose verdict (MOVING_TYPEWRITER)
  finished:              "FINISHED"
  # My Dictionary screen
  words_collected:       "{count} words collected"
  dictionary_total_score: "Total Score: {count}"
  dictionary_sort_alpha: "Sort: A-Z"
  dictionary_sort_score: "Sort: Score"
  # Word-submission errors
  err_not_in_dictionary: "Word is not in the dictionary"
  err_shooting_miss:     "Not a word -- shots cleared"
  err_not_on_board:      "Word isn't on the board"
  # not_on_board split into three sub-classes (see game_screen._not_on_board_reason)
  err_not_on_board_missing_letter: "Not enough of those letters on the board"
  err_not_on_board_needs_rearrange: "The right pieces are here -- move them together"
  err_not_on_board_gram_mismatch:  "Those letters are here, but the pieces don't line up"
  err_too_short:         "Word is too short"
  err_not_involved:      "Word didn't involve placed piece"
  err_not_fossil:        "Word didn't involve a fossilized cell"
  err_already_cleared:   "Word already cleared"
  err_already_selected_one_way: "Already selected (only one way to spell it here)"
  err_every_way_selected:       "Every way to spell that here is already selected"
  # Spelling suggestion shown under err_not_in_dictionary ({words} = comma list)
  did_you_mean:          "Did you mean: {words}?"

