# Game mode: a PARTIAL config deep-merged onto assets/config.yaml (see config.py /
# apply_game_mode). Only list keys that DEFINE this mode; everything else comes
# from the base file. mode_label is the menu name, stripped before merge.
# Signature = OMNISWAP PRESET in CONFIG_REFERENCE.md. Tune the timer to taste.
mode_label: "Omniswap — fossilize"

rules:
  game_screen.mode:                 rule_mode_omniswap_vs_timer
  # Board starts full and swappable; formed words freeze; no instant win; words
  # form anywhere; every commit is a select turn.
  game_screen.setup_formation:      rule_formation_fill_player_diagonal

  game_screen.clear_action:         rule_fossilize_cells
  game_screen.fossil_word_use: rule_fossil_allow

  game_screen.victory:              rule_victory_none
  game_screen.show_end_button:  rule_show_end_button

  game_screen.skip_select_isolated: rule_never_skip_select
  game_screen.select_trigger:       rule_select_every_placement
  game_screen.word_nucleation:      rule_nucleate_anywhere
  game_screen.select_word_limit:    rule_one_word_per_select
  # Timer: whole-game race clock; tune the countdown length.
  game_screen.omniswap_timer:         rule_omniswap_timer_race
  game_screen.omniswap_timer_seconds: 360
