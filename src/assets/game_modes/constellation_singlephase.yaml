# Game mode: a PARTIAL config deep-merged onto assets/config.yaml (see config.py /
# apply_game_mode). Only list keys that DEFINE this mode; everything else comes
# from the base file. mode_label is the menu name, stripped before merge.
#
# Single-phase (MOVING_AND_SELECTING) constellation: the constellation typing
# game with no MOVING -> SELECTING transition. The board is pre-filled and never
# rearranged; the one merged right pane both highlights (as you type) and submits
# (ENTER), all within MOVING. See game_screen.phase_model in CONFIG_REFERENCE.md.
mode_label: "Constellation — single phase"

rules:
  game_screen.mode: rule_mode_constellation

  game_screen.constellation_max_paths:  24
  game_screen.constellation_turnover:   rule_constellation_replenish
  game_screen.constellation_auto_end:   rule_constellation_auto_end_off

  game_screen.gram_usage: rule_gram_use_whole
  game_screen.hunt_highlight: rule_hunt_full_gram
  game_screen.rightclick_unigram: rule_rightclick_none
  game_screen.rightclick_cc: rule_rightclick_none
  game_screen.rightclick_cv: rule_rightclick_none
  game_screen.rightclick_vc: rule_rightclick_none
  game_screen.rightclick_vv: rule_rightclick_none
  game_screen.rightclick_ck: rule_rightclick_none
  game_screen.rightclick_vcv: rule_rightclick_none
  game_screen.rightclick_cvk: rule_rightclick_none

  # Board starts full, words form anywhere.
  game_screen.setup_formation:      rule_formation_fill_ideation_trigram_sidepanes_zigzag
  game_screen.word_nucleation:      rule_nucleate_anywhere
  game_screen.skip_select_isolated: rule_never_skip_select
  game_screen.select_trigger:       rule_select_every_placement
  game_screen.gram_manip_in_selecting: rule_gram_manip_in_selecting_enabled
  game_screen.clear_action:         rule_clear_remove
  game_screen.victory:              rule_victory_none
  game_screen.word_trail:           rule_word_trail_off

  # Single-phase essentials: one merged pane, words clear the instant they are
  # submitted (no phase-end batch), no per-select word cap (keep typing), and
  # auto-pick spellings for the speed mindset (no confirm friction). The cycle
  # chooser is wired for single-phase too -- flip clear_disambiguation to a
  # rule_disambig_cycle_* rule to get the board chooser here instead.
  game_screen.phase_model:          rule_single_phase
  game_screen.clear_timing:         rule_clear_on_submit
  game_screen.select_word_limit:    rule_unlimited_words
  game_screen.clear_disambiguation: rule_disambig_auto_pick
