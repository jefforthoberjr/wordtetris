# All game colors live here, separate from the behavior rules in config.yaml,
# so restyling is one edit point. Values are RGB or RGBA, 0-255 per channel
# (the alpha channel is only needed for text labels and translucent panels).
# Names are addressed by dotted path in code, e.g. get_color("board.settled_cell_fill").

board:
  settled_cell_fill: [255, 255, 255]   # settled cell fill (placed pieces)
  active_piece_fill: [100, 180, 245]   # darker blue: the live/movable piece
  placed_piece_fill: [173, 216, 230]  # light blue: pieces placed this moving phase, awaiting selection
  cursor_fill:      [80, 80, 80]      # dark grey: the MOVING_TYPEWRITER cursor cell
  fossilized_fill:  [165, 165, 165]   # stone grey: a fossilized cell (formed word, frozen + dead)
  pending_word_fill: [144, 238, 144]  # light green: cells of a word selected to clear at phase end (batch mode)
  cell_border:      [0, 0, 0]         # cell outline (square border / hex outer)
  cell_text:        [0, 0, 0, 255]    # gram/letter glyphs (flat default; plain rule + preview)
  cell_text_low_value:  [0, 0, 0, 255]      # low end of the board.cell_text_color score gradient
  cell_text_high_value: [184, 134, 11, 255]  # dark gold: high end of the board.cell_text_color score gradient
  hunt_highlight:   [220, 20, 20, 255]  # MOVING-phase word-hunt: letters of the typed search word, recolored on top of cell_text
  obstacle_fill:    [255, 204, 153]   # light orange: pre-placed obstacle cells
  mission_fill:     [255, 153, 153]   # light red: pre-placed mission cells (the goal to clear)
  # mission_fill:     [204, 153, 255]   # light purple: pre-placed mission cells (the goal to clear)
  grid_line:        [200, 200, 200]   # grid lines (square + hex)
  word_trail:       [0, 0, 0]         # cleared-word path trail (drawn at game_screen.word_trail_opacity)
  disambig_line:          [135, 206, 250]   # light blue: unselected candidate paths in the "select which one" chooser
  disambig_line_selected: [0, 0, 180]       # dark blue: the currently-highlighted candidate path
  background:       [255, 255, 255]   # game board window background

window:
  background:       [0, 0, 0]         # default clear color (menu / title screens)

# Right pane shown during the MOVING phase: the game-long cleared-word list.
moving_side_pane:
  divider:          [200, 200, 200]   # vertical rule between board and side pane
  wordlist_text:    [30, 30, 30, 255] # cleared-word list entries
  wordlist_new_text: [30, 160, 60, 255] # green: a word new to the player's dictionary
  wordlist_obscure_text: [235, 140, 20, 255] # orange: a NEW word from the obscure tier only
  wordlist_score:   [110, 130, 115, 255] # muted green-grey: each word's points, right of the word
  word_count:       [120, 120, 120, 255] # player dictionary size, pinned bottom
  phase_label:      [40, 40, 40, 255]  # "Pieces: N" countdown to the next select phase, pinned top
  score_label:      [40, 90, 60, 255]  # running point total, shown under the timer/pieces label
  button_text:      [40, 90, 170, 255] # clickable "Select words" label (matches selecting pane buttons)
  hunt_prompt:      [120, 120, 120, 255] # "Hunt a word:" prompt above the hunt field
  hunt_input:       [30, 30, 30, 255]    # the word being typed to hunt grams on the board
  hunt_placeholder: [180, 180, 180, 255] # faint caret when the hunt field is empty

# Right pane shown during the SELECTING phase: type a word to clear.
selecting_side_pane:
  divider:          [200, 200, 200]      # vertical rule (matches moving side pane)
  prompt:           [120, 120, 120, 255] # "Type a word:" prompt
  input_text:       [30, 30, 30, 255]    # the word being typed
  placeholder:      [180, 180, 180, 255] # faint caret when input is empty
  button_text:      [40, 90, 170, 255]   # clickable Submit / Next labels
  error_text:       [200, 40, 40, 255]   # error messages
  word_count:       [120, 120, 120, 255] # player dictionary size, pinned bottom
  phase_label:      [40, 40, 40, 255]    # "pick words:" header, pinned top (matches moving pane)
  score_label:      [40, 90, 60, 255]    # running point total, shown under the header/timer
  # (the this-phase accepted-word list reuses ScrollingWordList, which is
  #  styled by moving_side_pane.wordlist_text)

# "My Dictionary" screen: paged, read-only list of every word the player owns.
dictionary:
  background:       [255, 250, 205]       # light yellow: whole-screen background
  title_text:      [60, 60, 40, 255]      # word-count readout
  word_text:       [40, 40, 30, 255]      # the paged word-grid entries
  tab_fill:        [255, 255, 255]        # inactive A-Z page tab (white)
  tab_active:      [255, 250, 205]        # current letter's tab (matches bg, looks "open")
  tab_border:      [150, 150, 110]        # outline around every tab
  tab_text:        [60, 60, 40, 255]      # the A-Z letter glyph on each tab

# Victory overlay shown centered on the grid when a game is won.
victory:
  panel:            [40, 60, 40]          # solid panel behind the VICTORY text
  text:             [255, 215, 0, 255]    # "VICTORY" lettering (gold)

menu:
  highlight:        [255, 255, 0, 255]   # selected menu item
  normal:           [255, 255, 255, 255] # unselected menu item
  panel:            [50, 50, 50]         # in-game menu panel background
